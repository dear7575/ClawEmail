[project]
name = "claw-email-api"
version = "0.1.0"
description = "Python FastAPI backend for the ClawEmail migration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
