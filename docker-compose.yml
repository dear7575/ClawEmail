services:
  claw-email:
    image: ghcr.io/dear7575/clawemail:latest
    container_name: claw-email
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DATABASE_PATH: /app/data/app.db
      CLAW_DOMAIN: ${CLAW_DOMAIN:-claw.163.com}
      SYSTEM_PROXY_URL: ${SYSTEM_PROXY_URL:-}
      SYSTEM_REQUEST_TIMEOUT_MS: ${SYSTEM_REQUEST_TIMEOUT_MS:-10000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SUB2_API_URL: ${SUB2_API_URL:-}
      SUB2_API_KEY: ${SUB2_API_KEY:-}
      SUB2_PROXY_TEMPLATE_JSON: ${SUB2_PROXY_TEMPLATE_JSON:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
